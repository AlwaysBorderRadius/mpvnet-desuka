# screenshotfolder: per-series screenshot folders (read at startup, restart to apply key changes)
# naming_mode=series -> S/<Series>/<Series> (N).ext
# naming_mode=season -> S/<Series>/<Season>/<Season> (N).ext
# NOTE: 's' is taken over by this script (forced binding, uses screenshot_mode).
# Ctrl+s and the mpv.net menu still take native shots (mpv.conf template) as fallback.
screenshot_key=s
file_ext=png
save_location=D:/Imagenes/mpv screenshots/
short_saved_message=yes
include_YouTube_ID=yes
hide_subtitles=no
screenshot_mode=window
png_compression=7
jpeg_quality=95
sequential_numbering=yes
naming_mode=series
