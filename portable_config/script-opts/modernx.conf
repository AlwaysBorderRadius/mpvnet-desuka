####################
#      Idioma      #
####################
language=es

####################
#  Comportamiento  #
####################
bottom_hover=no
raise_subtitles=no
key_bindings=no
osc_keep_with_cursor=yes

####################
#  Diseño Interfaz #
####################
vid_scale=yes
window_title=no
title_hide_extension=yes
show_chapter_markers=yes
scale_windowed=1
scale_fullscreen=1
thumbnail_border=3
thumbnail_border_radius=3
thumbnail_border_color="#000000"
thumbnail_border_outline="#000000"
volume_bar_orientation=vertical
volume_bar_position=left
seek_bar_orientation=horizontal
seek_bar_position=bottom
track_language_mode=flag

#############
#  Botones  #
#############
compact_mode=no
jump_buttons=no
info_button=yes
screenshot_button=yes
# DESUKA: top-left button opening the advanced menu (input.conf #menu: rows)
menu_button=yes
show_file_size=no

####################
#  Tamaño Botones  #
####################
playpause_size=24
midbuttons_size=22
sidebuttons_size=22

###################
#  Tamaño fuente  #
###################
title_font_size=30
description_font_size=25
time_font_size=20
font=Segoe UI

####################
#  Bandera tooltip  #
####################
track_flag_gap=2
track_flag_size=16
track_menu_max_rows=8
track_menu_font_size=18
track_menu_radius=5
track_menu_bg_color="#141414"
track_menu_bg_opacity=1
track_menu_border_color="#999999"
# 0-8 playres px
track_menu_border_size=0
track_menu_animation=yes
track_menu_animation_distance=20

####################
#  Toast unificado #
####################
# Canal único (preemptivo, sin cola). kind: info|success|warn|error|persistent
toast_enabled=yes
toast_animation=yes
toast_font_size=20
toast_max_width=900
toast_top_margin=80
toast_position=top-left
toast_side_margin=25
toast_info_color="#1D96F5"
toast_success_color="#00D400"
toast_warn_color="#FFC107"
toast_error_color="#E81123"
toast_persistent_color="#9D96F5"
toast_bg_color="#000000"
toast_bg_opacity=1
toast_bg_border_size=0
toast_bg_border_color="#000000"
toast_bg_border_kind_colors=yes
toast_text_color="#FFFFFF"
toast_text_border_size=1
toast_text_border_color="#000000"
toast_pad_x=22
toast_pad_y=5
toast_text_dy=-1
toast_bar_width=4
toast_bar_length=0.9
toast_bar_color=
toast_bar_position=auto
toast_bar_gap=-4
toast_pad_bottom=0
toast_bg_border_opacity=1.0
toast_bg_radius=12