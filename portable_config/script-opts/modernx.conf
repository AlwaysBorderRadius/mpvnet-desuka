####################
#      Idioma      #
####################
language=es

####################
#  Comportamiento  #
####################
bottom_hover=no
raise_subtitles=no
key_bindings=no
osc_keep_with_cursor=yes

####################
#  Diseño Interfaz #
####################
vid_scale=yes
window_title=no
title_hide_extension=yes
show_chapter_markers=yes
scale_windowed=1
scale_fullscreen=1
thumbnail_border=3
thumbnail_border_radius=3
thumbnail_border_color="#000000"
thumbnail_border_outline="#000000"
volume_bar_orientation=vertical
volume_bar_position=left
seek_bar_orientation=horizontal
seek_bar_position=bottom
track_language_mode=flag

#############
#  Botones  #
#############
compact_mode=no
jump_buttons=no
info_button=yes
screenshot_button=yes
show_file_size=no

####################
#  Tamaño Botones  #
####################
playpause_size=24
midbuttons_size=22
sidebuttons_size=22

###################
#  Tamaño fuente  #
###################
title_font_size=30
description_font_size=25
time_font_size=20
font=Segoe UI

####################
#  Bandera tooltip  #
####################
track_flag_gap=2
track_flag_size=16

####################
#  Toast unificado #
####################
# Canal único (preemptivo, sin cola). kind: info|success|warn|error|persistent
toast_enabled=yes
toast_font_size=20
toast_max_width=900
toast_y_offset=200
toast_y_offset_hidden=80
toast_info_color="#1D96F5"
toast_success_color="#00D400"
toast_warn_color="#FFC107"
toast_error_color="#E81123"
toast_persistent_color="#9D96F5"