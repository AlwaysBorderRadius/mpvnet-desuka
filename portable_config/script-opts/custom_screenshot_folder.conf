# custom_screenshot_folder: per-series screenshot folders (read at startup, restart to apply key changes)
# naming_mode=series -> S/<Series>/<Series> (N).ext
# naming_mode=season -> S/<Series>/<Season>/<Season> (N).ext
# unmatched files -> S/<quarantine>/<Filename> (N).ext (see quarantine_name)
# Rules live in portable_config/scripts/custom_screenshot_folder.lua (custom_rules table, priority order).
# DESUKA: all screenshot keys go through this script, so numbering never collides (native shots would reuse (N) and fail).
save_location=D:/Imagenes/mpv screenshots/
naming_mode=season
sequential_numbering=yes
hide_subtitles=no
screenshot_mode=window
short_saved_message=yes
file_ext=png
png_compression=7
jpeg_quality=95
include_YouTube_ID=yes
quarantine_name=_sin-clasificar
log_matched_rule=yes
