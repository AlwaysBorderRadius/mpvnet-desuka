##############################################
#           CONFIGURACIÓN GENERAL            #
##############################################

###########
#  Audio  #
###########
volume=100                      # Volumen inicial (0-100) // Initial volume (0-100)
volume-max=100                  # Límite máximo de volumen; por encima de 100 amplifica (limitado a 100: más amplificación distorsiona) // Maximum volume; above 100 amplifies (capped at 100: more amplification distorts)

###############
#  Subtitles  #
###############
alang=jpn,eng,en,en-US,spa,es-ES,und                # Idiomas preferidos de audio // Preferred audio languages
slang=spa,es-ES,es-150,es-419,eng,en,en-US,und      # Idiomas preferidos de subtítulos // Preferred subtitle languages
sub-auto=fuzzy                                      # Carga subs externos cuyo nombre contenga el del vídeo (p. ej. extraídos <Video>.subN.ass) // Load external subs containing the video filename (e.g. extracted <Video>.subN.ass)
demuxer-mkv-subtitle-preroll=yes                    # Intenta mostrar correctamente los subs embebidos al avanzar/retroceder // Try to correctly show embedded subs when seeking
blend-subtitles=no                                  # Selecciona si se mezclan los subtítulos con el vídeo o no // Select whether or not to blend subtitles with the video
                                                        # - no: Renderiza por separado, subtitulo mas nitido y sin alterar + subtitulos no salen en capturas
                                                        # - video: El subtitulo se renderiza junto al video. De normal se ve horrible, borroso, pero si usas shaders u otros efectos los subtitulos pasaran por los mismos filtros que la imagen + subtitulos salen en capturas

#####################
#  Window / Player  #
#####################
#border=yes                        # (Default: yes) Muestra/oculta la decoración de la ventana (valores: yes/no) // Show/hide window decorations (values: yes/no)
title-bar=no                      # Elimina la barra de titulo de la ventana // Remove the window title-bar
autofit=60%                       # Tamaño inicial de la ventana (valor tal cual) // Initial window size (value as-is)
geometry=50%:50%                  # Posición de la ventana en pantalla (valor tal cual) // Window position on screen (value as-is)
hidpi-window-scale=yes            # Escala ventana y OSD con la escala de pantalla (necesario en HiDPI) // Scale window and OSD with display scale (needed on HiDPI)
cursor-autohide=1500              # Oculta automaticamente el cursor si no hay movimiento (ms) (valores: no/always/tiempo_en_ms) // Autohides cursor (values: no/always/time_in_ms)
#fullscreen=yes                    # Inicia en pantalla completa // Start fullscreen
#keep-open=yes                     # No cierra el reproductor al terminar el video // Don't close the player after finishing the video

# Reanudar posición (Watch later)
resume-playback=no                # Evita que mpv recuerde ajustes previos de cada archivo // Prevents mpv from remembering previous settings for each file
save-position-on-quit=no          # Guarda el progreso al salir (anula el yes gestionado) // Save progress on quit (overrides managed yes)

##############
#  Playlist  # (autoload nativo)
##############
--autocreate-playlist=no			# Bloquea la funcion nativa de crear listas de reproduccion. Mejor usar Autoload.lua // Blocks the native playlist creation function. Better use Autoload.lua
#autocreate-playlist=filter          # Monta playlist con los demas videos en la carpeta (equivale a same_type+videos del script) // Builds a playlist with the other videos in the folder
#directory-filter-types=video        # Solo vídeos // Videos only
#directory-mode=ignore               # No baja a subcarpetas // Don't descend into subfolders

#############
#  OSC/OSD  #
#############
osc=no                              # 'no' requerido para el OSC de ModernX // 'no' required for ModernX OSC
osd-font='Segoe UI'                 # Fuente usada en la interfaz (cualquier fuente instalada en el sistema) // Font used for the OSD (any system-installed font)
osd-font-size=20                    # Tamaño de la fuente del OSD // OSD font size
osd-scale=1                         # Escala general del OSD (reducir/aumentar tamaño) // Overall OSD scaling factor
osd-border-size=1                   # Tamaño del borde de los mensajes en pantalla y de la barra de progreso // Border size of OSD messages and progress bar
osd-bar=no                          # Barra de progreso y volumen // Bar for progress and volume
osd-bar-h=2                         # Altura de la barra de progreso y volumen // Height of the progress and volume bar
osd-bar-w=60                        # Ancho de la barra de progreso y volumen // Width of progress and volume bar
osd-duration=1500                   # Duración de los mensajes en pantalla (ms) // How long osd messages show (ms)
osd-playing-msg=                    # Dejarlo vacio evita que muestre un mensaje de lo que se esta reproduciendo // Leaving it empty prevents it from displaying a message about what is currently playing

#################
#  Screenshots  #
#################
# Solo para capturas nativas. Con screenshotfolder.lua no se usa
# Las teclas 's' y 'Ctrl+s' las gestiona screenshotfolder.lua.
# Only for vanilla screenshots. with screenshotfolder.lua active these are not needed.
# Keybinds 's' and 'Ctrl+s' are managed by screenshotfolder.lua.
#screenshot-format=png                     # Capturas en formato PNG // Screenshots in PNG format
#screenshot-directory=~~/screenshots/      # Carpeta donde se guardan capturas (~~/screenshots/ = carpeta de capturas dentro de portable_config) // Directory for screenshots (~~/screenshots/ = screenshots folder inside portable_config)
#screenshot-template='%F__%P__%04n'        # Nombre de archivo: archivo__posición__número // File name: file__position__number

#####################
#  Input / Control  #
#####################
input-doubleclick-time=200          # Ventana (ms) para detectar doble clic: mas corta para no fusionar clics sencillos rapidos // Double-click detection window (ms): shorter so fast single clicks are not fused

#########
#  Log  #
#########
log-file=~~home/mpv.log             # Ubicacion de los logs (raiz portable)
msg-level=all=warn                  # La consola solo muestra avisos y errores (sin spam de debug) // Console only shows warnings and errors (no debug spam)
